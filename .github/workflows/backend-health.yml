name: Backend health
on:
  schedule:
    - cron: "4,14,24,34,44,54 * * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: production-backend-health
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check production FastAPI health
        shell: bash
        run: |
          set -o pipefail
          curl --fail --silent --show-error --retry 1 --connect-timeout 10 --max-time 80 \
            https://majorproject-new.onrender.com/api/health | jq -e '.status == "ok"'
